name: 'APK Builder Action'
description: 'Automates building debug/release APKs for Android repositories (public or private) with Gradle caching and GitHub Release publishing.'
author: 'Nissan Ahmed (Modernized by Enternameet)'
branding:
  icon: 'box'
  color: 'green'

inputs:
  repository:
    description: 'Git repository URL, or "." / "local" to build the current checked-out repository'
    required: true
    default: 'https://github.com/android/sunflower'
  authToken:
    description: 'Personal Access Token (PAT) or Auth token for private repository [Optional]'
    required: false
    default: ''
  branchName:
    description: 'Git branch name [Optional]'
    required: false
    default: ''
  subdir:
    description: 'Relative subdirectory path when the project is nested [Optional]'
    required: false
    default: ''
  jdkVersion:
    description: 'OpenJDK version (recommended: 17 or 21)'
    required: false
    default: '21'
  taskName:
    description: 'Gradle task name (e.g. assembleRelease, assembleDebug, or "auto" for smart multi-module detection)'
    required: false
    default: 'auto'
  uploadArtifact:
    description: 'Whether to upload the generated APK as a workflow artifact'
    required: false
    default: 'true'
  retentionDays:
    description: 'Retention days for uploaded artifact'
    required: false
    default: '7'
  publishRelease:
    description: 'Whether to publish the generated APK(s) to a GitHub Release'
    required: false
    default: 'false'
  releaseTag:
    description: 'Custom tag name for the GitHub release [Optional]'
    required: false
    default: ''
  releaseTitle:
    description: 'Custom title for the GitHub release [Optional]'
    required: false
    default: ''
  releasePrerelease:
    description: 'Mark the release as a pre-release'
    required: false
    default: 'true'
  releaseDraft:
    description: 'Mark the release as a draft'
    required: false
    default: 'false'
  githubToken:
    description: 'GitHub Token with contents:write permissions for publishing releases [Optional]'
    required: false
    default: ''

outputs:
  apk-path:
    description: 'Path to the primary generated APK file'
    value: ${{ steps.find-apk.outputs.apk_path }}
  apk-dir:
    description: 'Directory containing all generated APK files'
    value: ${{ steps.find-apk.outputs.apk_dir }}
  artifact-name:
    description: 'Name of the uploaded artifact'
    value: ${{ steps.find-apk.outputs.artifact_name }}
  release-url:
    description: 'URL of the published GitHub release (if publishRelease is true)'
    value: ${{ steps.publish-release.outputs.release_url }}

runs:
  using: 'composite'
  steps:
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.jdkVersion }}

    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Prepare project workspace
      shell: bash
      env:
        AUTH_TOKEN: ${{ inputs.authToken }}
        REPO_URL: ${{ inputs.repository }}
        BRANCH_NAME: ${{ inputs.branchName }}
      run: |
        rm -rf workspace apk-outputs
        mkdir -p workspace apk-outputs

        CLEAN_REPO_URL="${REPO_URL%/}"

        if [ "$CLEAN_REPO_URL" = "." ] || [ "$CLEAN_REPO_URL" = "local" ] || [ -z "$CLEAN_REPO_URL" ]; then
          echo "Reusing current repository workspace..."
          find . -mindepth 1 -maxdepth 1 ! -name 'workspace' ! -name 'apk-outputs' ! -name '.git' -exec cp -r {} workspace/ \;
        else
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

          if [ -n "$AUTH_TOKEN" ]; then
            echo "::add-mask::$AUTH_TOKEN"
            if [[ "$AUTH_TOKEN" == *":"* ]]; then
              B64_AUTH=$(printf "%s" "$AUTH_TOKEN" | base64 -w 0)
              git config --global url."https://${AUTH_TOKEN}@".insteadOf "https://"
            else
              B64_AUTH=$(printf "%s" "x-access-token:$AUTH_TOKEN" | base64 -w 0)
              git config --global url."https://x-access-token:${AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"
              git config --global url."https://${AUTH_TOKEN}@".insteadOf "https://"
            fi
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $B64_AUTH"
          fi

          echo "Cloning repository $CLEAN_REPO_URL..."
          if [[ -z "$BRANCH_NAME" ]]; then
            git clone --recurse-submodules --depth=1 "$CLEAN_REPO_URL" workspace
          else
            git clone --recurse-submodules --depth=1 --branch "$BRANCH_NAME" "$CLEAN_REPO_URL" workspace
          fi

          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          if [ -n "$AUTH_TOKEN" ]; then
            git config --global --unset-all url."https://x-access-token:${AUTH_TOKEN}@github.com/".insteadOf 2>/dev/null || true
            git config --global --unset-all url."https://${AUTH_TOKEN}@".insteadOf 2>/dev/null || true
          fi
        fi

    - name: Convert Web App to Android (if applicable)
      shell: bash
      env:
        SUBDIR: ${{ inputs.subdir }}
      run: |
        cd ./workspace/"$SUBDIR"
        if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ] && [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ] && [ -f "package.json" ]; then
          echo "Detected a Node.js project. Installing dependencies..."
          if [ -f "yarn.lock" ]; then
            npx yarn install --frozen-lockfile
          elif [ -f "pnpm-lock.yaml" ]; then
            npx pnpm install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

          if [ ! -d "android" ]; then
            echo "Auto-wrapping web app with Capacitor..."
            npm run build --if-present

            WEB_DIR="www"
            if [ -d "dist" ]; then WEB_DIR="dist"; fi
            if [ -d "build" ]; then WEB_DIR="build"; fi
            if [ -d "out" ]; then WEB_DIR="out"; fi
            mkdir -p "$WEB_DIR"

            npm install @capacitor/core @capacitor/android
            npm install -D @capacitor/cli
            npx cap init "App" com.example.app --web-dir "$WEB_DIR"
            npx cap add android
            echo "Capacitor Android project generated."
          else
            echo "Existing 'android' directory found. Skipping Capacitor auto-wrap."
          fi
        fi

    - name: Build APK
      shell: bash
      working-directory: ./workspace/${{ inputs.subdir }}
      env:
        TASK_INPUT: ${{ inputs.taskName }}
      run: |
        if [ -d "android" ] && [ -f "android/build.gradle" ] && [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
          echo "Switching to 'android' directory for native build..."
          cd android
        fi

        if [ ! -f "gradlew" ]; then
          echo "gradlew not found, attempting to generate wrapper..."
          gradle wrapper || true
        fi
        chmod +x gradlew

        run_gradle_with_checksum_fallback() {
          set +e
          "$@" 2>&1 | tee /tmp/gradle-build.log
          local status=${PIPESTATUS[0]}
          set -e

          if [ $status -eq 0 ]; then
            return 0
          fi

          if grep -q "Verification of Gradle distribution failed" /tmp/gradle-build.log \
            && [ -f "gradle/wrapper/gradle-wrapper.properties" ] \
            && grep -q "^distributionSha256Sum=" gradle/wrapper/gradle-wrapper.properties; then
            echo "Gradle wrapper checksum verification failed, retrying once without distributionSha256Sum."
            sed -i '/^distributionSha256Sum=/d' gradle/wrapper/gradle-wrapper.properties
            "$@"
            return $?
          fi

          return $status
        }

        setup_release_signing_if_needed() {
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Generating debug keystore for release signing..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
            mkdir -p "$HOME/.android"
            mv debug.keystore "$HOME/.android/debug.keystore"
          fi
        }

        run_resolved_task() {
          local task_name="$1"
          echo "Executing Gradle task: $task_name"

          if [[ "$task_name" == *Release* ]]; then
            echo "Release task detected. Setting up signing key..."
            setup_release_signing_if_needed
            run_gradle_with_checksum_fallback ./gradlew "$task_name" \
              -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
              -Pandroid.injected.signing.store.****** \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.****** \
              --stacktrace --no-daemon
          else
            run_gradle_with_checksum_fallback ./gradlew "$task_name" --stacktrace --no-daemon
          fi
        }

        add_task_candidate() {
          local candidate="$1"
          for existing in "${TASK_CANDIDATES[@]}"; do
            if [ "$existing" = "$candidate" ]; then
              return 0
            fi
          done
          TASK_CANDIDATES+=("$candidate")
        }

        # Resolve Gradle task (auto-detection if requested or blank)
        RESOLVED_TASK="$TASK_INPUT"
        if [ -z "$RESOLVED_TASK" ] || [ "$RESOLVED_TASK" = "auto" ]; then
          echo "Auto-detecting best Gradle build task..."
          SETTINGS_FILE=""
          if [ -f "settings.gradle.kts" ]; then SETTINGS_FILE="settings.gradle.kts"; fi
          if [ -f "settings.gradle" ]; then SETTINGS_FILE="settings.gradle"; fi

          TASK_CANDIDATES=()
          add_task_candidate "assembleRelease"

          if [ -n "$SETTINGS_FILE" ] && grep -q ":app" "$SETTINGS_FILE"; then
            add_task_candidate ":app:assembleRelease"
          elif [ -d "app" ]; then
            add_task_candidate ":app:assembleRelease"
          fi

          if [ -n "$SETTINGS_FILE" ] && grep -q "composeApp" "$SETTINGS_FILE"; then
            add_task_candidate ":composeApp:assembleRelease"
          elif [ -d "composeApp" ]; then
            add_task_candidate ":composeApp:assembleRelease"
          fi

          BUILD_SUCCEEDED=false
          for candidate_task in "${TASK_CANDIDATES[@]}"; do
            echo "Trying auto-detected task candidate: $candidate_task"
            if run_resolved_task "$candidate_task"; then
              RESOLVED_TASK="$candidate_task"
              BUILD_SUCCEEDED=true
              break
            fi
            echo "::warning::Gradle task '$candidate_task' failed. Trying next candidate..."
          done

          if [ "$BUILD_SUCCEEDED" != "true" ]; then
            echo "::error::All auto-detected Gradle task candidates failed."
            exit 1
          fi
        else
          run_resolved_task "$RESOLVED_TASK"
        fi

    - name: Locate and Stage APKs
      id: find-apk
      shell: bash
      env:
        REPO_URL: ${{ inputs.repository }}
      run: |
        mkdir -p apk-outputs

        CLEAN_URL="${REPO_URL%/}"
        CLEAN_URL="${CLEAN_URL%.git}"
        REPO_NAME=$(basename "$CLEAN_URL")
        if [ -z "$REPO_NAME" ] || [ "$REPO_NAME" = "." ] || [ "$REPO_NAME" = "local" ]; then
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
        fi
        if [ -z "$REPO_NAME" ]; then
          REPO_NAME="app"
        fi

        # Find all valid non-test, non-unaligned APKs
        mapfile -t ALL_APKS < <(find workspace -type f -name "*.apk" ! -name "*androidTest*.apk" ! -name "*-unaligned.apk")

        if [ ${#ALL_APKS[@]} -eq 0 ]; then
          echo "::error::No APK files were generated in workspace!"
          exit 1
        fi

        echo "Found ${#ALL_APKS[@]} APK(s):"
        PRIMARY_APK=""
        COUNT=0

        for APK in "${ALL_APKS[@]}"; do
          ORIG_NAME=$(basename "$APK")
          echo "Processing: $APK ($ORIG_NAME)"

          if [[ "$ORIG_NAME" == "$REPO_NAME"* ]]; then
            DEST_NAME="$ORIG_NAME"
          elif [[ "$ORIG_NAME" == app-* ]]; then
            DEST_NAME="${REPO_NAME}-${ORIG_NAME#app-}"
          elif [ "$ORIG_NAME" = "app.apk" ]; then
            DEST_NAME="${REPO_NAME}.apk"
          elif [[ "$ORIG_NAME" == composeApp-* ]]; then
            DEST_NAME="${REPO_NAME}-${ORIG_NAME#composeApp-}"
          else
            DEST_NAME="${REPO_NAME}-${ORIG_NAME}"
          fi

          DEST_PATH="apk-outputs/$DEST_NAME"
          cp "$APK" "$DEST_PATH"

          if [ -z "$PRIMARY_APK" ]; then
            PRIMARY_APK="$DEST_PATH"
          fi
          COUNT=$((COUNT + 1))
        done

        PRIMARY_NAME=$(basename "$PRIMARY_APK")
        ARTIFACT_NAME="${PRIMARY_NAME%.apk}"

        echo "Primary APK: $PRIMARY_APK"
        echo "apk_path=$PRIMARY_APK" >> $GITHUB_OUTPUT
        echo "apk_dir=apk-outputs" >> $GITHUB_OUTPUT
        echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
        echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

    - name: Upload APK artifact
      if: ${{ inputs.uploadArtifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.find-apk.outputs.artifact_name }}
        path: apk-outputs/*.apk
        retention-days: ${{ inputs.retentionDays }}

    - name: Publish to GitHub Release
      id: publish-release
      if: ${{ inputs.publishRelease == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.githubToken || github.token }}
        RELEASE_TAG_INPUT: ${{ inputs.releaseTag }}
        RELEASE_TITLE_INPUT: ${{ inputs.releaseTitle }}
        IS_PRERELEASE: ${{ inputs.releasePrerelease }}
        IS_DRAFT: ${{ inputs.releaseDraft }}
        REPO_NAME: ${{ steps.find-apk.outputs.repo_name }}
        BRANCH_NAME: ${{ inputs.branchName }}
      run: |
        TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
        SHORT_SHA=""
        if [ -d "workspace/.git" ]; then
          SHORT_SHA=$(git -C workspace rev-parse --short HEAD 2>/dev/null || echo "")
        fi

        TAG="$RELEASE_TAG_INPUT"
        if [ -z "$TAG" ]; then
          if [ -n "$SHORT_SHA" ]; then
            TAG="build-${REPO_NAME}-${SHORT_SHA}-${TIMESTAMP}"
          else
            TAG="build-${REPO_NAME}-${TIMESTAMP}"
          fi
        fi

        TITLE="$RELEASE_TITLE_INPUT"
        if [ -z "$TITLE" ]; then
          BRANCH_INFO="${BRANCH_NAME:-default}"
          TITLE="${REPO_NAME} (${BRANCH_INFO}) - ${TIMESTAMP}"
        fi

        echo "Publishing release with tag: $TAG, title: $TITLE"

        FLAGS=()
        if [ "$IS_PRERELEASE" = "true" ]; then
          FLAGS+=(--prerelease)
        fi
        if [ "$IS_DRAFT" = "true" ]; then
          FLAGS+=(--draft)
        fi

        BODY="Automated build for **${REPO_NAME}**${BRANCH_NAME:+ on branch \`$BRANCH_NAME\`}${SHORT_SHA:+ (commit \`$SHORT_SHA\`)}.\n\nGenerated on $(date -u +'%Y-%m-%d %H:%M:%S UTC')."

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists, uploading assets with clobber..."
          gh release upload "$TAG" apk-outputs/*.apk --clobber
        else
          gh release create "$TAG" apk-outputs/*.apk \
            --title "$TITLE" \
            --notes "$(echo -e "$BODY")" \
            "${FLAGS[@]}"
        fi

        RELEASE_URL=$(gh release view "$TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}")
        echo "Release published: $RELEASE_URL"
        echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT
