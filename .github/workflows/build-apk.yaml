name: Build Android APK
run-name: ${{ github.event.inputs.repository || inputs.repository }} ${{ (github.event.inputs.branchName || inputs.branchName) && format('{0}', github.event.inputs.branchName || inputs.branchName) }} ${{ (github.event.inputs.subdir || inputs.subdir) && format('[/{0}]', github.event.inputs.subdir || inputs.subdir) }} :${{ github.event.inputs.taskName || inputs.taskName }}
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Git repository URL (or '.' to build current repo)"
        required: true
        default: "https://github.com/android/sunflower"
      authToken:
        description: "Personal Access Token (PAT) / Auth token for private repository [Optional]"
        required: false
        default: ""
      branchName:
        description: "Git branch name [Optional]"
        required: false
        default: ""
      subdir:
        description: "Relative subdirectory path when the project is nested [Optional]"
        required: false
        default: ""
      jdkVersion:
        description: "OpenJDK version (recommended: 17 or 21)"
        required: false
        default: "21"
      taskName:
        description: "build.gradle task name: auto, assembleDebug, assembleRelease, etc."
        required: false
        default: "auto"
      publishRelease:
        description: "Publish generated APK(s) to GitHub Releases"
        required: false
        type: boolean
        default: false
      releaseTag:
        description: "Custom release tag name [Optional]"
        required: false
        default: ""
  workflow_call:
    inputs:
      repository:
        description: "Git repository URL"
        required: true
        type: string
      authToken:
        description: "Personal Access Token (PAT) / Auth token for private repository [Optional]"
        required: false
        type: string
        default: ""
      branchName:
        description: "Git branch name [Optional]"
        required: false
        type: string
        default: ""
      subdir:
        description: "Relative subdirectory path when the project is nested [Optional]"
        required: false
        type: string
        default: ""
      jdkVersion:
        description: "OpenJDK version (recommended: 17 or 21)"
        required: false
        type: string
        default: "21"
      taskName:
        description: "build.gradle task name: auto, assembleDebug, assembleRelease, etc."
        required: false
        type: string
        default: "auto"
      publishRelease:
        description: "Publish generated APK(s) to GitHub Releases"
        required: false
        type: boolean
        default: false
      releaseTag:
        description: "Custom release tag name [Optional]"
        required: false
        type: string
        default: ""
    secrets:
      authToken:
        description: "Auth token as secret [Optional]"
        required: false
      releaseToken:
        description: "GitHub token for release creation [Optional]"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run APK Builder Action
        uses: ./
        with:
          repository: ${{ github.event.inputs.repository || inputs.repository }}
          authToken: ${{ github.event.inputs.authToken || inputs.authToken || secrets.authToken }}
          branchName: ${{ github.event.inputs.branchName || inputs.branchName }}
          subdir: ${{ github.event.inputs.subdir || inputs.subdir }}
          jdkVersion: ${{ github.event.inputs.jdkVersion || inputs.jdkVersion }}
          taskName: ${{ github.event.inputs.taskName || inputs.taskName }}
          publishRelease: ${{ github.event.inputs.publishRelease || inputs.publishRelease || 'false' }}
          releaseTag: ${{ github.event.inputs.releaseTag || inputs.releaseTag }}
          githubToken: ${{ secrets.releaseToken || secrets.GITHUB_TOKEN }}
